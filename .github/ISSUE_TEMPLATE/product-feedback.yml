name: 分享一个需求
description: 写一个你希望 TAIL 帮忙解决的具体场景，无需准备测试报告
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 欢迎分享想法。一个具体场景就够了；请勿提交凭据、真实账户或未脱敏交易记录。
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: 你在做什么，哪个步骤最不方便、最耗时或最容易出错？
      placeholder: 例如：研究多个钱包时，我需要反复切换页面才能比较买入和退出的过程……
    validations:
      required: true
  - type: textarea
    id: current_workflow
    attributes:
      label: 你现在怎么做？（可选）
      description: 可以介绍现有工具或处理方式，无需提供账户信息。
  - type: textarea
    id: expected_result
    attributes:
      label: 什么结果对你有帮助？（可选）
      description: 可以描述想看到的信息或希望减少的操作。
  - type: checkboxes
    id: safety
    attributes:
      label: 公开信息确认
      options:
        - label: 内容不包含凭据、真实账户或未脱敏交易记录。
          required: true
